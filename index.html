<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Betting Pool - Krish Jain vs Kshitij Pankaj</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1115;
    --card: #171a22;
    --border: #262b37;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --green: #31c48d;
    --red: #f45b69;
    --gold: #f7b32b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap { width: 100%; max-width: 980px; }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: 14px;
  }

  .commission-badge {
    display: inline-block;
    margin-top: 10px;
    background: rgba(247, 179, 43, 0.12);
    border: 1px solid rgba(247, 179, 43, 0.4);
    color: var(--gold);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .event-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .event-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .event-header h2 { font-size: 18px; }

  .event-total {
    font-size: 13px;
    color: var(--muted);
  }
  .event-total span { color: var(--text); font-weight: 700; }

  .runners { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .runner {
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.2s;
  }

  .runner.krish { border-color: rgba(79, 140, 255, 0.45); }
  .runner.kshitij { border-color: rgba(49, 196, 141, 0.45); }

  .runner-name { font-size: 16px; font-weight: 700; }

  .stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }
  .stats-row b { color: var(--text); }

  .pool-bar {
    height: 8px;
    background: #1c2029;
    border-radius: 999px;
    overflow: hidden;
  }
  .pool-bar > div { height: 100%; border-radius: 999px; }

  .odds-tag {
    background: #171b25;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
  }
  .odds-tag .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .odds-tag .value { font-size: 20px; font-weight: 800; margin-top: 2px; }

  .bet-control { display: flex; gap: 8px; flex-wrap: wrap; }
  .bet-control input[type=text] { flex: 1 1 100%; }
  .bet-control input[type=number] { flex: 1 1 60%; }
  .bet-control input {
    flex: 1;
    background: #1c2029;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 15px;
    min-width: 0;
  }
  .bet-control input:focus { outline: none; border-color: var(--accent); }
  .bet-control button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .bet-control button:hover { filter: brightness(1.1); }

  .return-hint { font-size: 13px; color: var(--muted); text-align: center; }
  .return-hint b { color: var(--green); }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-top: 6px;
  }

  .summary-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .summary-box .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .summary-box .value { font-size: 22px; font-weight: 800; margin-top: 4px; }

  .muted { color: var(--muted); }
  .green { color: var(--green); }
  .gold { color: var(--gold); }

  .bets-list { margin-top: 14px; }
  .bets-list h3 { font-size: 14px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .bet-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .bet-item .who { font-weight: 700; }
  .bet-item .amt { font-weight: 700; }
  .bet-item .pot { color: var(--muted); }
  .bet-item button {
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
  }
  .bet-item button:hover { text-decoration: underline; }

  .empty { color: var(--muted); font-size: 13px; font-style: italic; }

  .clear-all {
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .clear-all:hover { background: rgba(244, 91, 105, 0.1); }

  .bettors-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
  }

  .crown-btn {
    width: 100%;
    background: rgba(247, 179, 43, 0.15);
    border: 1px solid rgba(247, 179, 43, 0.5);
    color: var(--gold);
    border-radius: 10px;
    padding: 9px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .crown-btn:hover { background: rgba(247, 179, 43, 0.25); }

  .crown-hint {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    background: rgba(247, 179, 43, 0.12);
    border: 1px solid rgba(247, 179, 43, 0.4);
    border-radius: 10px;
    padding: 9px;
  }

  .settlement-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
  }
  .settlement-card h3 {
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .winner-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .reset-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
  }
  .reset-btn:hover { color: var(--text); }
  .pay-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .pay-from { color: var(--red); font-weight: 700; }
  .pay-to { color: var(--green); font-weight: 700; }
  .pay-arrow { color: var(--gold); font-size: 12px; }
  .pay-amt { font-weight: 800; font-size: 15px; }
  .bettors-card h3 {
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .bettor-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .bettor-name { font-weight: 800; }
  .bettor-total { color: var(--muted); white-space: nowrap; }
  .bettor-total b { color: var(--green); }
  .bettor-bets { display: flex; flex-wrap: wrap; gap: 6px; }
  .bettor-detail {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    color: var(--text);
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
  }

  @media (max-width: 560px) {
    .runners { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏁 Sprint Betting Pool</h1>
    <p>Krish Jain vs Kshitij Pankaj</p>
    <span class="commission-badge">1% House Commission</span>
  </header>

  <div id="root"></div>

  <footer>
    Pari-mutuel style: winners split 99% of the pool (after 1% house commission).<br />
    We will get back to you with more bets *winkk
    Odds &amp; returns update live as bets come in.
  </footer>
</div>

<script>
const EVENTS = [
  { id: "100m", name: "100m Dash", runners: [
    { name: "Krish Jain", key: "krish", color: "79, 140, 255" },
    { name: "Kshitij Pankaj", key: "kshitij", color: "49, 196, 141" },
  ]},
  { id: "400m", name: "400m Dash", runners: [
    { name: "Krish Jain", key: "krish", color: "79, 140, 255" },
    { name: "Kshitij Pankaj", key: "kshitij", color: "49, 196, 141" },
  ]},
];

const COMMISSION = 0.01;
const STORAGE_KEY = "sprint_bets";
const WINNERS_KEY = "sprint_winners";

function loadBets() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

let bets = loadBets();
const root = document.getElementById("root");

function loadWinners() {
  try { return JSON.parse(localStorage.getItem(WINNERS_KEY)) || {}; }
  catch { return {}; }
}

let winners = loadWinners();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(bets));
}

function saveWinners() {
  localStorage.setItem(WINNERS_KEY, JSON.stringify(winners));
}

function settleWinner(evKey, runnerKey) {
  const { pool } = totalsFor(EVENTS.find(e => e.id === evKey));
  if (pool <= 0) { alert("No bets on this event yet."); return; }
  winners[evKey] = runnerKey;
  saveWinners();
  render();
}

function clearWinner(evKey) {
  delete winners[evKey];
  saveWinners();
  render();
}

function fmt(n) {
  return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
}

function eventBets(ev) {
  const list = [];
  ev.runners.forEach(r => {
    const arr = bets[ev.id + "_" + r.key] || [];
    arr.forEach((b, i) => list.push({
      runnerKey: r.key,
      runnerName: r.name,
      amount: typeof b === "number" ? b : (b.amount || 0),
      bidder: typeof b === "number" ? "Unknown" : (b.name || "Unknown"),
      ...{ runnerColor: r.color },
      ...{ id: ev.id + "_" + r.key + "_" + i },
    }));
  });
  return list;
}

function totalsFor(ev) {
  const totals = {};
  let pool = 0;
  ev.runners.forEach(r => {
    const amt = (bets[ev.id + "_" + r.key] || []).reduce((a, b) => a + (typeof b === "number" ? b : (b.amount || 0)), 0);
    totals[r.key] = amt;
    pool += amt;
  });
  return { totals, pool };
}

function placeBet(evKey, runnerKey, amount, name) {
  const n = Number(amount);
  const who = String(name || "").trim();
  if (!isFinite(n) || n <= 0) { alert("Enter a valid bet amount above 0."); return; }
  if (!who) { alert("Enter your name."); return; }
  const arr = (bets[evKey + "_" + runnerKey] || []).slice();
  arr.push({ amount: n, name: who });
  bets[evKey + "_" + runnerKey] = arr;
  save();
  render();
}

function removeBet(id) {
  const [evKey, runnerKey, idx] = id.split("_");
  const arr = (bets[evKey + "_" + runnerKey] || []).slice();
  arr.splice(Number(idx), 1);
  bets[evKey + "_" + runnerKey] = arr;
  save();
  render();
}

function clearAll() {
  if (!confirm("Clear all bets?")) return;
  bets = {};
  save();
  render();
}

function netPositions() {
  const net = {};
  EVENTS.forEach(ev => {
    const winner = winners[ev.id];
    if (!winner) return;
    const { totals, pool } = totalsFor(ev);
    if (pool <= 0) return;
    const winningPool = pool * (1 - COMMISSION);
    const book = totals[winner];
    if (book <= 0) return;
    const betsFor = eventBets(ev);
    betsFor.forEach(b => {
      const payout = b.runnerKey === winner
        ? (b.amount / book) * winningPool
        : 0;
      net[b.bidder] = (net[b.bidder] || 0) + (payout - b.amount);
    });
    net["StakeLite (house)"] = (net["StakeLite (house)"] || 0) + pool * COMMISSION;
  });
  return net;
}

function settlementPayments() {
  const net = netPositions();
  const creditors = Object.keys(net).filter(k => net[k] > 0.005).map(k => ({ name: k, amt: net[k] }));
  const debtors = Object.keys(net).filter(k => net[k] < -0.005).map(k => ({ name: k, amt: -net[k] }));
  creditors.sort((a, b) => b.amt - a.amt);
  debtors.sort((a, b) => b.amt - a.amt);
  const payments = [];
  let i = 0, j = 0;
  while (i < creditors.length && j < debtors.length) {
    const c = creditors[i], d = debtors[j];
    const amt = Math.min(c.amt, d.amt);
    if (amt > 0.005) payments.push({ from: d.name, to: c.name, amt });
    c.amt -= amt;
    d.amt -= amt;
    if (c.amt < 0.005) i++;
    if (d.amt < 0.005) j++;
  }
  return { payments, net };
}

function settlementHtml() {
  const settled = EVENTS.filter(ev => winners[ev.id]);
  const { payments, net } = settlementPayments();

  const winnerLines = EVENTS
    .filter(ev => winners[ev.id])
    .map(ev => {
      const w = ev.runners.find(r => r.key === winners[ev.id]);
      const { totals, pool } = totalsFor(ev);
      const book = totals[w.key] || 0;
      const payoutPerUnit = book > 0 ? (pool * (1 - COMMISSION)) / book : 0;
      return `
        <div class="winner-line" style="border-color: rgb(${w.color});">
          <span>🏆 <b>${ev.name}</b> → <b style="color: rgb(${w.color});">${w.name}</b> wins</span>
          <span class="muted">payout ×${payoutPerUnit.toFixed(2)} per ₹1</span>
          <button class="reset-btn" data-reset="${ev.id}">↺ redo</button>
        </div>`;
    })
    .join("");

  if (!settled.length) {
    return `
      <div class="settlement-card">
        <h3>🧾 Settlement — who pays whom</h3>
        <div class="empty">No events settled yet. Pick a winner on each event card to see who pays whom.</div>
      </div>`;
  }

  const rows = payments.length
    ? payments.map(p => `
        <div class="pay-row">
          <span class="pay-from">💸 ${p.from}</span>
          <span class="pay-arrow">→ pays →</span>
          <span class="pay-to">🤑 ${p.to}</span>
          <span class="pay-amt">${fmt(p.amt)}</span>
        </div>`).join("")
    : '<div class="empty">All nets settle to zero.</div>';

  return `
    <div class="settlement-card">
      <h3>🧾 Settlement — who pays whom</h3>
      <div class="winner-list" style="margin-bottom:12px;">${winnerLines}</div>
      ${rows}
    </div>`;
}

function render() {
  let html = "";
  let grandPool = 0;

  EVENTS.forEach(ev => {
    const { totals, pool } = totalsFor(ev);
    grandPool += pool;
    const winningPool = pool * (1 - COMMISSION);
    const runnersHtml = ev.runners.map(r => {
      const book = totals[r.key];
      const odds = book > 0 ? winningPool / book : 1 / (1 - COMMISSION);
      const returnPerUnit = book > 0 ? winningPool / book : 1 / (1 - COMMISSION);
      const pct = pool > 0 ? (book / pool) * 100 : 0;
      const allBets = eventBets(ev).filter(b => b.runnerKey === r.key);

      return `
        <div class="runner ${r.key}">
          <div>
            <div class="runner-name">${r.name}</div>
            <div class="stats-row">
              <span>Pool: <b>${fmt(book)}</b></span>
              <span>Share: <b>${pct.toFixed(1)}%</b></span>
              <span>Bets: <b>${allBets.length}</b></span>
            </div>
          </div>

          <div class="pool-bar">
            <div style="width: ${pct}%; background: rgb(${r.color});"></div>
          </div>

          <div class="odds-tag">
            <div class="label">Returns per ₹1 (odds + 1)</div>
            <div class="value">x${returnPerUnit.toFixed(2)}</div>
          </div>

          <div>
            <div class="bet-control" data-ev="${ev.id}" data-runner="${r.key}">
              <input type="text" maxlength="30" placeholder="Your name" />
              <input type="number" min="1" step="any" placeholder="₹ amount" />
              <button class="place-btn">Place Bet</button>
            </div>
            <div class="return-hint" style="margin-top:8px;">
              Potential return: <b>₹${(returnPerUnit * (amountInput(ev.id, r.key) || 0)).toFixed(2)}</b>
            </div>
            ${winners[ev.id] === r.key
              ? `<div class="crown-hint">🏆 Crowned winner of ${ev.name}</div>`
              : `<button class="crown-btn" data-crown="${ev.id}" data-runner="${r.key}">🏆 Crown ${r.name} winner</button>`}
          </div>
        </div>
      `;
    }).join("");

    const allBets = eventBets(ev);
    const listHtml = allBets.length
      ? allBets.map(b => `
          <div class="bet-item">
            <span class="who" style="color: rgb(${b.runnerColor});">● ${b.runnerName}</span>
            <span class="amt">${fmt(b.amount)}</span>
            <span class="pot">by <b>${b.bidder}</b> → would win ~${fmt(b.amount * (totals[b.runnerKey] > 0 ? (pool * (1 - COMMISSION)) / totals[b.runnerKey] : 0))}</span>
            <button data-remove="${b.id}">×</button>
          </div>`).join("")
      : '<div class="empty">No bets placed on this event yet.</div>';

    html += `
      <div class="event-card">
        <div class="event-header">
          <h2>${ev.name}</h2>
          <div class="event-total">Event pool: <span>${fmt(pool)}</span> · After 1% cut: <span>${fmt(winningPool)}</span></div>
        </div>

        <div class="runners">${runnersHtml}</div>

        <div class="bets-list">
          <h3>Bets — ${ev.name}</h3>
          ${listHtml}
        </div>
      </div>
    `;
  });

  html += `
    <div class="summary">
      <div class="summary-box">
        <div class="label">Total Pool</div>
        <div class="value">${fmt(grandPool)}</div>
      </div>
      <div class="summary-box">
        <div class="label">House Commission (1%)</div>
        <div class="value gold">${fmt(grandPool * COMMISSION)}</div>
      </div>
      <div class="summary-box">
        <div class="label">Winners Split</div>
        <div class="value green">${fmt(grandPool * (1 - COMMISSION))}</div>
      </div>
    </div>
    ${settlementHtml()}
    <div class="bettors-card">
      <h3>Bettors — who bet how much</h3>
      ${bettorsHtml()}
    </div>
    <button class="clear-all" id="clearAll">Clear all bets</button>
  `;

  root.innerHTML = html;

  root.querySelectorAll(".place-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const control = btn.closest(".bet-control");
      const name = control.querySelector("input[type=text]").value;
      const amount = control.querySelector("input[type=number]").value;
      placeBet(control.dataset.ev, control.dataset.runner, amount, name);
    });
  });

  root.querySelectorAll("input").forEach(input => {
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const btn = input.closest(".bet-control").querySelector(".place-btn");
        btn.click();
      }
    });
    input.addEventListener("input", renderPreview);
  });

  root.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => removeBet(btn.dataset.remove));
  });

  root.querySelectorAll("[data-crown]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!confirm(`Crown this runner as the winner of this event?`)) return;
      settleWinner(btn.dataset.crown, btn.dataset.runner);
    });
  });

  root.querySelectorAll("[data-reset]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!confirm("Undo the winner for this event?")) return;
      clearWinner(btn.dataset.reset);
    });
  });

  const clearBtn = document.getElementById("clearAll");
  if (clearBtn) clearBtn.addEventListener("click", clearAll);
}

function bettorsHtml() {
  const byName = {};
  EVENTS.forEach(ev => {
    eventBets(ev).forEach(b => {
      if (!byName[b.bidder]) byName[b.bidder] = { total: 0, bets: [] };
      byName[b.bidder].total += b.amount;
      byName[b.bidder].bets.push({
        event: ev.name,
        runner: b.runnerName,
        amount: b.amount,
        color: b.runnerColor,
      });
    });
  });

  const names = Object.keys(byName);
  if (!names.length) return '<div class="empty">No bets placed yet.</div>';

  return names.map(name => {
    const p = byName[name];
    const detail = p.bets.map(b =>
      `<span class="bettor-detail" style="border-color: rgb(${b.color});">${b.event} · ${b.runner}: ${fmt(b.amount)}</span>`
    ).join("");
    return `
      <div class="bettor-row">
        <span class="bettor-name">👤 ${name}</span>
        <span class="bettor-bets">${detail}</span>
        <span class="bettor-total">Total: <b>${fmt(p.total)}</b></span>
      </div>`;
  }).join("");
}

function amountInput(evId, runnerKey) {
  const el = root.querySelector(`[data-ev="${evId}"][data-runner="${runnerKey}"] input[type=number]`);
  return el ? Number(el.value) : 0;
}

function renderPreview() {
  root.querySelectorAll(".bet-control").forEach(control => {
    const hint = control.parentElement.querySelector(".return-hint b");
    const amt = Number(control.querySelector("input[type=number]").value) || 0;
    const ev = EVENTS.find(e => e.id === control.dataset.ev);
    if (!ev) return;
    const { totals, pool } = totalsFor(ev);
    const book = totals[control.dataset.runner];
    const ret = book > 0 ? (pool * (1 - COMMISSION)) / book : 1 / (1 - COMMISSION);
    hint.textContent = "₹" + (ret * amt).toFixed(2);
  });
}

render();
</script>
</body>
</html>
